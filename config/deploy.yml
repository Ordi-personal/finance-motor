service: finance-motor
image: vagneralencar/finance-motor

deploy_timeout: 90
drain_timeout: 45

servers:
  web:
    hosts:
      - 167.86.123.161
    options:
      network-alias: finance-motor-web
    labels:
      kamal-proxy.host: finance.ordime.app,finance.fluxome.app
      kamal-proxy.ssl: "true"
      kamal-proxy.app_port: 4000
  job:
    hosts:
      - 167.86.123.161
    cmd: bundle exec sidekiq

registry:
  server: ghcr.io
  username: vagneralencar
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - REDIS_URL
    - SECRET_KEY_BASE
    - RESEND_API_KEY
    - DB_HOST
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - ORDI_SHARED_SECRET
    - SSO_SECRET_KEY
    - SIDEKIQ_WEB_USERNAME
    - SIDEKIQ_WEB_PASSWORD
    - OIDC_ISSUER
    - OIDC_CLIENT_ID
    - OIDC_CLIENT_SECRET
    - OIDC_REDIRECT_URI
  clear:
    PORT: 4000
    APP_DOMAIN: finance.ordime.app
    APP_URL: https://finance.ordime.app
    SELF_HOSTED: true
    ONBOARDING_STATE: closed
    ENABLE_FRAME_ANCESTORS: true
    HTTP_ALLOWED_HOSTS: https://finance.ordime.app,https://finance.fluxome.app,finance-motor-web
    FRAME_ANCESTORS_HOSTS: https://ordime.app,https://admin.ordime.app,https://fluxome.app,https://admin.fluxome.app
    BRAND_NAME: Ordi
    PRODUCT_NAME: Ordi Finanças
    RAILS_SERVE_STATIC_FILES: true
    RAILS_ASSUME_SSL: true

proxy:
  ssl: true
  host: finance.ordime.app,finance.fluxome.app
  app_port: 4000
  healthcheck:
    path: /up
    interval: 3
    timeout: 10

builder:
  arch: amd64
  args:
    RUBY_VERSION: 3.4.2
